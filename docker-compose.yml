services:
  backend:
    build: ./backend
    image: social-network-backend
    container_name: social-network-backend
    environment:
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - db-data:/app/data
      - uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    image: social-network-frontend
    container_name: social-network-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
  uploads:
